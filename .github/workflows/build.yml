name: Build Checklists

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stamp copyright and update date into Preflight
        run: |
          for f in $(find checklists -name '*.json'); do
            d=$(git log -1 --format=%cs -- "$f")
            jq --arg d "$d" '. as $r | .groups |= map(.checklists |= map(if .title == "Preflight Inspection" then .items = [{prompt: ($r.metadata.copyrightInfo + ". Updated " + $d + "."), type: "ITEM_NOTE"}] + .items else . end))' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

      - name: Compile checklists
        uses: alexnj/aviation-checklist-compiler-action@main
        with:
          create_release: false
          formats: 4col,csv,ace,gplt,fmd

      - name: Remove the old rolling release (new build gets a fresh date, old files go)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag --yes || true

      - name: Publish rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Automatic Release Build
          make_latest: false
          body_path: output.md
          files: output-release/*
