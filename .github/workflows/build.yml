name: Build Checklists

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set build stamp (rolling builds are DRAFT)
        run: |
          echo "BUILD_STAMP=Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7}) $(date -u +'%Y-%m-%d %H:%MZ')" >> "$GITHUB_ENV"
          echo "DRAFT_LABEL=DRAFT" >> "$GITHUB_ENV"
          echo "CHECKLIST_DRAFT=1" >> "$GITHUB_ENV"

      - name: Stamp copyright, revision and build into each checklist
        run: |
          for f in $(find checklists -name '*.json'); do
            d=$(git log -1 --format=%cs -- "$f")
            n=$(git rev-list --count HEAD -- "$f")
            jq --arg d "$d" --arg n "$n" --arg s "$BUILD_STAMP" --arg dr "$DRAFT_LABEL" '
              .metadata.makeAndModel = ((.metadata.makeAndModel // "") + (if $dr != "" then " " + $dr else "" end))
              | .metadata.aircraftInfo = ((.metadata.aircraftInfo // "") + " · Rev " + $n + " (" + $d + ") · " + $s)
              | . as $r
              | .groups |= map(.checklists |= map(if .title == "Preflight Inspection" then .items = [{prompt: ($r.metadata.copyrightInfo + ". Rev " + $n + ", updated " + $d + ". " + $s + "." + (if $dr != "" then " DRAFT: not for operational use." else "" end)), type: "ITEM_NOTE"}] + .items else . end))' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

      - name: Compile checklists
        uses: alexnj/aviation-checklist-compiler-action@main
        with:
          create_release: false
          formats: 4col,csv,ace,gplt,fmd

      - name: Build half-letter checklist cards (PDF)
        run: |
          npm install --no-save pdfkit@0.20.2
          mkdir -p output-release
          for s in cards/*-card.json; do
            node cards/make-card.js "$s" "output-release/$(basename "$s" .json).pdf"
          done

      - name: Upload cards as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cards
          path: output-release/*-card.pdf

      - name: Remove the old rolling release (new build gets a fresh date, old files go)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag --yes || true

      - name: Publish rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Automatic Release Build
          make_latest: false
          body_path: output.md
          files: output-release/*
